name: Test automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [local, dev, qa, prod]
        default: local
      language:
        description: Language (short code or BCP-47 tag, e.g. fr / fr-FR)
        type: string
        default: en

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches/PRs, but let every push to main finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TEST_ENV: ${{ inputs.environment || 'local' }}
  TEST_LANGUAGE: ${{ inputs.language || 'en' }}
  # For non-local environments, point at real hosts without editing
  # config/settings.py by defining these repo variables:
  # PYTEST_BASE_URL: ${{ vars.PYTEST_BASE_URL }}
  # COUNTRY_API_BASE_URL: ${{ vars.COUNTRY_API_BASE_URL }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install "ruff>=0.8,<1"   # keep in sync with requirements-dev.txt

      - name: Run Ruff
        run: ruff check --output-format=github .

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install API dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: >
          pytest -m api
          --reruns 2 --reruns-delay 5
          --only-rerun "ConnectionError|ConnectTimeout|ReadTimeout|Timeout|HTTPError"
          --junitxml=test-results/api-junit.xml

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-py${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: warn

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install UI dependencies
        run: pip install -r requirements.txt

      - name: Resolve Playwright version
        id: pw
        run: pip show playwright | awk '/^Version:/ {print "version=" $2}' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Chromium system dependencies (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: Run UI tests
        run: >
          pytest -m ui --browser chromium
          --reruns 2 --reruns-delay 5
          --only-rerun "TimeoutError|Timeout|ConnectionError|net::ERR"
          --tracing retain-on-failure
          --screenshot only-on-failure
          --video retain-on-failure
          --junitxml=test-results/ui-junit.xml

      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: warn
